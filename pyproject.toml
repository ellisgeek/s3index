[project]
name = "s3index"
version = "2026.08.0"
description = "A simple script to generate index files for S3 Buckets"
readme = "README.md"
requires-python = ">=3.10, <3.14"
dependencies = [
    "humanize>=4.12.1",
    "jinja2>=3.1.5",
    "magika>=0.6.2",
    "minio>=7.2.15",
    "pydantic-settings>=2.8.1",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "typer>=0.27.1",
    "urllib3>=2.3.0",
    "yarl>=1.18.3",
]

[project.scripts]
s3index = "s3index:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s3index"]

[dependency-groups]
dev = [
    "bump-my-version>=1.5.1",
    "commitizen>=4.17.0",
    "prek>=0.4.13",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
    "ty>=0.0.72",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--cov=s3index --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["src/s3index"]
omit = ["src/s3index/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length=120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
fixable = ["ALL"]

[tool.commitizen]
name = "cz_conventional_commits"

[tool.bumpversion]
current_version = "2026.08.0"
parse = """(?x)
    (?P<release>
        (?:[1-9][0-9]{3})\\.  # YYYY.
        (?:1[0-2]|0[1-9])     # 0M
    )
    \\.(?P<micro>0|[1-9]\\d*)
"""
serialize = ["{release}.{micro}"]
commit = true
tag = true
tag_name = "v{new_version}"

[tool.bumpversion.parts.release]
calver_format = "{YYYY}.{0M}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
