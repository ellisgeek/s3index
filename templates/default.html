<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{{ bucket_nane }} - Index</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.classless.indigo.min.css">
  </head>
  <body>
    <main class="container">
      <h1>{{ bucket_name }}</h1>
      <table>
        <thead>
          <tr>
            <td>Object</td>
            <td>Size</td>
            <td>Updated</td>
            {# <td>Type</td> #}
          </tr>
        </thead>
        <tbody>
{% for obj in objects %}
          <tr>
            <td><a href="{{ obj.s3url }}"><code>{{ obj.path }}</code></a></td>
            <td><code>{{ obj.bytes }} ({{ obj.size }})</code></td>
            <td>{{ obj.last_modified }}</td>
            {# <td>{{ obj.content_type }}</td> #}
          </tr>
{% endfor %}
        </tbody>
      </table>
    </main>
  </body>
</html>
